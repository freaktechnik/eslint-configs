name: test
on: [push, pull_request]
permissions: {}
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ">=15.8"
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
  lint-js:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ">=15.8"
          check-latest: true
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npm run lint
